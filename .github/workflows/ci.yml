name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Linux builds the platform-independent core library and runs the unit tests.
  # The runnable server target is Windows-only for now, so we build just the
  # test target here.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build --target miniredis_tests
      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  # Windows builds everything (including the Winsock server) and runs the tests.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
